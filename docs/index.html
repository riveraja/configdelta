<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Config Delta</title>
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="style.css?v=ceb0355a">
</head>
<body>
<header>
  <div class="brand">
    <div class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v3a3 3 0 0 0 3 3h6.5M15.5 12l3 2.5-3 2.5"/></svg></div>
    <h1>Config Delta</h1>
  </div>
  <div class="top-actions">
    <label class="engine">Engine <select id="engine" aria-label="Database engine"></select></label>
    <button id="update" type="button" title="Check for new releases and extract them"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><span>Update</span></button>
  <div class="theme" role="group" aria-label="Color theme">
    <button type="button" data-theme-choice="system" aria-pressed="true">System</button>
    <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
    <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
  </div>
  </div>
  <p class="sub">Compare configuration, defaults and deprecations across database releases. The first selected version is the baseline.</p>
</header>

<main>
  <aside>
    <div class="side-scroll">
    <h2>Versions</h2>
    <div id="versions">Loading…</div>
    <div class="actions">
      <button id="clear" type="button">Clear</button>
      <button id="expand" type="button">Expand all</button>
      <button id="collapse" type="button">Collapse all</button>
    </div>
    </div>
    <div id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0"></div>
  </aside>

  <section>
    <div id="toolbar" hidden>
      <div class="kinds" role="group" aria-label="Kind">
      </div>
      <label><input type="checkbox" data-cat="added" checked> <span class="tag added">added</span></label>
      <label><input type="checkbox" data-cat="removed" checked> <span class="tag removed">removed</span></label>
      <label><input type="checkbox" data-cat="deprecated" checked> <span class="tag deprecated">deprecated</span></label>
      <label><input type="checkbox" data-cat="changed" checked> <span class="tag changed">default changed</span></label>
      <label title="Hide variables whose default depends on the container (hostname, server UUID) or is computed from the build (performance_schema_error_size)">
        <input type="checkbox" id="novolatile" checked> hide environment/build-derived
      </label>
      <label id="showopts-label" title="Include options that exist only as mysqld startup/plugin options (for example --check-table-functions) and are not system variables" hidden>
        <input type="checkbox" id="showopts"> include startup-only options
      </label>
      <input id="search" type="search" placeholder="Filter by name…">
      <button id="csv" type="button">Export CSV</button>
    </div>
    <div id="summary"></div>
    <div id="results"><p class="empty">Select two or more versions to compare.</p></div>
  </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<aside id="update-report" role="status" aria-live="polite" hidden></aside>
<script src="app.js?v=7073ac9b"></script>
</body>
</html>
